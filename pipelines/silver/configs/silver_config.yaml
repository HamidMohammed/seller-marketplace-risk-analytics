# =========================================================
# SILVER LAYER CONFIGURATION
# =========================================================

environment: local

paths:
  bronze:
    orders: data/bronze/orders/
    order_items: data/bronze/order_items/
    customers: data/bronze/customers/
    sellers: data/bronze/sellers/
    products: data/bronze/products/
    payments: data/bronze/payments/
    reviews: data/bronze/reviews/
    geolocation: data/bronze/geolocation/
    category_translation: data/bronze/category_translation/
    mql: data/bronze/mql/
    closed_deals: data/bronze/closed_deals

  silver:
    orders: data/silver/orders/
    order_items: data/silver/order_items/
    customers: data/silver/customers/
    sellers: data/silver/sellers/
    products: data/silver/products/
    payments: data/silver/payments/
    reviews: data/silver/reviews/
    geolocation: data/silver/geolocation/
    category_translation: data/silver/category_translation/
    mql: data/silver/mql/
    closed_deals: data/silver/closed_deals
    order_delivery_staging: data/silver/order_delivery_staging/
    seller_fulfillment_staging: data/silver/seller_fulfillment_staging/
    reviews_staging: data/silver/reviews_staging/
    seller_acquisition_staging: data/silver/seller_acquisition_staging/
    sales_staging: data/silver/sales_staging/
    seller_performance_monthly_staging: data/silver/seller_performance_monthly_staging/
    orders: data/silver/orders/

    orders_quarantine:
      data/silver/quarantine/orders/

    order_items_quarantine:
      data/silver/quarantine/order_items/

    reviews_quarantine:
      data/silver/quarantine/reviews/

    payments_quarantine:
      data/silver/quarantine/payments/

    products_quarantine:
      data/silver/quarantine/products/

  gold:
    dim_date: 
      data/gold/dim_date/

    dim_customer: data/gold/dim_customer/
    dim_seller: data/gold/dim_seller/
    dim_product: data/gold/dim_product/
    fct_order_delivery: data/gold/fct_order_delivery/
    fct_seller_fulfillment: data/gold/fct_seller_fulfillment/
    fct_customer_reviews: data/gold/fct_customer_reviews/
    fct_order_sales: data/gold/fct_order_sales/
    

metadata:
  source_system: olist
  transformation_version: v1

validation:
  fail_on_duplicates: true
  fail_on_null_business_keys: true

logging:
  log_level: INFO


silver_pipeline:
  core:

    - geolocation/transform_geolocation.py
    - category_translation/transform_category_translation.py
    - orders/transform_orders.py
    - customers/transform_customers.py
    - sellers/transform_sellers.py
    - products/transform_products.py
    - payments/transform_payments.py
    - reviews/transform_reviews.py
    - order_items/transform_order_items.py

  marketing:

    - mql/transform_mql.py
    - closed_deals/transform_closed_deals.py

  staging:

    - staging/transform_seller_acquisition_staging.py
    - staging/transform_order_delivery_staging.py
    - staging/transform_seller_fulfillment_staging.py
    - staging/transform_reviews_staging.py
    - staging/transform_sales_staging.py

  performance:

    - staging/transform_seller_performance_monthly_staging.py


orchestration:

  stop_on_failure: true

  run_marketing_layer: true

  run_performance_layer: true

  log_execution_time: true
